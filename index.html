<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pixel Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: white;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 6px;
      color: #facc15;
      letter-spacing: 2px;
    }

    .hud {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #94a3b8;
    }

    .hud strong {
      color: #22c55e;
      font-size: 16px;
    }

    canvas {
      border: 2px solid #334155;
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #1a1a2e;
      max-width: 100%;
      touch-action: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .ctrl-btn {
      width: 72px;
      height: 62px;
      border: 2px solid #475569;
      border-radius: 14px;
      background: #1e293b;
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: 0.1s;
    }

    .ctrl-btn:active {
      background: #334155;
      transform: scale(0.94);
    }

    .jump-btn {
      width: 110px;
      background: #b91c1c;
      border-color: #ef4444;
      font-size: 16px;
    }

    .jump-btn:active {
      background: #dc2626;
    }

    #message {
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5e1;
      text-align: center;
      min-height: 20px;
    }

    #startBtn {
      margin-top: 10px;
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: #052e16;
      font-size: 16px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <h1>⬜ PIXEL ADVENTURE</h1>

  <div class="hud">
    <div>Skor: <strong id="score">0</strong></div>
    <div>Record: <strong id="best">0</strong></div>
    <div>❤️ <strong id="lives">3</strong></div>
  </div>

  <canvas id="game" width="360" height="400"></canvas>

  <div class="controls">
    <div class="ctrl-btn" id="leftBtn">◀</div>
    <div class="ctrl-btn jump-btn" id="jumpBtn">JUMP</div>
    <div class="ctrl-btn" id="rightBtn">▶</div>
  </div>

  <div id="message">Tekan tombol untuk mulai bermain</div>
  <button id="startBtn">MAIN LAGI</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const livesEl = document.getElementById("lives");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");

    // ===== PIXEL ART DRAWING HELPERS =====
    const PIXEL = 4;

    function drawPixelChar(x, y, frame) {
      // Body
      ctx.fillStyle = "#3b82f6";
      ctx.fillRect(x + 4, y + 8, 16, 12);

      // Head
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(x + 6, y, 12, 10);

      // Eyes
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(x + 8, y + 4, 3, 3);
      ctx.fillRect(x + 14, y + 4, 3, 3);

      // Hat
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x + 4, y - 4, 16, 5);
      ctx.fillRect(x + 8, y - 8, 8, 4);

      // Legs (animated)
      ctx.fillStyle = "#1e40af";
      if (frame % 2 === 0) {
        ctx.fillRect(x + 5, y + 20, 5, 6);
        ctx.fillRect(x + 14, y + 20, 5, 6);
      } else {
        ctx.fillRect(x + 3, y + 20, 5, 6);
        ctx.fillRect(x + 16, y + 20, 5, 6);
      }

      // Arms
      ctx.fillStyle = "#fbbf24";
      if (frame % 2 === 0) {
        ctx.fillRect(x - 2, y + 10, 5, 4);
        ctx.fillRect(x + 21, y + 12, 5, 4);
      } else {
        ctx.fillRect(x - 2, y + 12, 5, 4);
        ctx.fillRect(x + 21, y + 10, 5, 4);
      }
    }

    function drawPixelCoin(x, y, frame) {
      ctx.fillStyle = (frame % 20 < 10) ? "#facc15" : "#fde68a";
      ctx.fillRect(x + 4, y, 8, 2);
      ctx.fillRect(x + 2, y + 2, 12, 2);
      ctx.fillRect(x, y + 4, 16, 8);
      ctx.fillRect(x + 2, y + 12, 12, 2);
      ctx.fillRect(x + 4, y + 14, 8, 2);

      // Shine
      ctx.fillStyle = "#fef9c3";
      ctx.fillRect(x + 4, y + 4, 3, 3);
    }

    function drawPixelSpike(x, y) {
      ctx.fillStyle = "#dc2626";
      for (let i = 0; i < 3; i++) {
        const sx = x + i * 10;
        ctx.fillRect(sx + 4, y, 3, 4);
        ctx.fillRect(sx + 2, y + 4, 7, 4);
        ctx.fillRect(sx, y + 8, 11, 4);
      }
      ctx.fillStyle = "#fca5a5";
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(x + i * 10 + 5, y + 1, 1, 2);
      }
    }

    function drawPixelHeart(x, y) {
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(x + 2, y, 4, 2);
      ctx.fillRect(x + 10, y, 4, 2);
      ctx.fillRect(x, y + 2, 16, 4);
      ctx.fillRect(x + 2, y + 6, 12, 4);
      ctx.fillRect(x + 4, y + 10, 8, 2);
      ctx.fillRect(x + 6, y + 12, 4, 2);
    }

    function drawCloud(x, y) {
      ctx.fillStyle = "rgba(148, 163, 184, 0.15)";
      ctx.fillRect(x, y + 4, 36, 8);
      ctx.fillRect(x + 4, y, 12, 4);
      ctx.fillRect(x + 20, y + 2, 8, 4);
    }

    function drawPlatform(x, y, w, h) {
      // Main
      ctx.fillStyle = "#065f46";
      ctx.fillRect(x, y, w, h);

      // Top grass
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(x, y, w, 4);

      // Grass detail
      ctx.fillStyle = "#16a34a";
      for (let i = 0; i < w; i += 8) {
        ctx.fillRect(x + i, y, 4, 2);
      }

      // Dirt texture
      ctx.fillStyle = "#854d0e";
      for (let i = 4; i < w - 4; i += 12) {
        for (let j = 8; j < h - 2; j += 8) {
          ctx.fillRect(x + i, y + j, 4, 3);
        }
      }
    }

    // ===== GAME STATE =====
    let player, platforms, coins, spikes, hearts;
    let scrollOffset, frameCount, gameScore, lives, bestScore;
    let gameOver, gameStarted, lastPlatformY;
    let keys = { left: false, right: false };
    let animFrame = 0;

    bestScore = parseInt(localStorage.getItem("pixelBest")) || 0;
    bestEl.textContent = bestScore;

    const clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * 360,
        y: Math.random() * 300,
        speed: 0.15 + Math.random() * 0.2
      });
    }

    // Stars
    const stars = [];
    for (let i = 0; i < 30; i++) {
      stars.push({
        x: Math.random() * 360,
        y: Math.random() * 400,
        size: Math.random() < 0.5 ? 1 : 2,
        blink: Math.floor(Math.random() * 60)
      });
    }

    function initGame() {
      player = {
        x: 160,
        y: 300,
        w: 24,
        h: 26,
        vy: 0,
        vx: 0,
        onGround: false,
        facing: 1
      };

      platforms = [];
      coins = [];
      spikes = [];
      hearts = [];

      // Ground
      platforms.push({ x: 0, y: 380, w: 360, h: 20 });

      // Starting platforms
      platforms.push({ x: 50, y: 310, w: 80, h: 14 });
      platforms.push({ x: 200, y: 250, w: 90, h: 14 });
      platforms.push({ x: 30, y: 190, w: 80, h: 14 });
      platforms.push({ x: 220, y: 130, w: 80, h: 14 });
      platforms.push({ x: 100, y: 70, w: 100, h: 14 });
      platforms.push({ x: 10, y: 10, w: 70, h: 14 });
      platforms.push({ x: 250, y: -50, w: 80, h: 14 });

      // Coins on platforms
      coins.push({ x: 80, y: 290, w: 16, h: 16, collected: false });
      coins.push({ x: 235, y: 230, w: 16, h: 16, collected: false });
      coins.push({ x: 55, y: 170, w: 16, h: 16, collected: false });
      coins.push({ x: 250, y: 110, w: 16, h: 16, collected: false });
      coins.push({ x: 140, y: 50, w: 16, h: 16, collected: false });

      lastPlatformY = -50;
      scrollOffset = 0;
      frameCount = 0;
      gameScore = 0;
      lives = 3;
      gameOver = false;
      gameStarted = true;

      scoreEl.textContent = "0";
      livesEl.textContent = "3";
      messageEl.textContent = "Lompat ke atas, kumpulkan koin!";
      startBtn.style.display = "none";
    }

    function generatePlatforms() {
      while (lastPlatformY - scrollOffset > -100) {
        lastPlatformY -= 60 + Math.floor(Math.random() * 40);
        const pw = 60 + Math.floor(Math.random() * 60);
        const px = Math.floor(Math.random() * (360 - pw));

        platforms.push({ x: px, y: lastPlatformY, w: pw, h: 14 });

        // Coin
        if (Math.random() < 0.6) {
          coins.push({
            x: px + pw / 2 - 8,
            y: lastPlatformY - 22,
            w: 16, h: 16,
            collected: false
          });
        }

        // Spike
        if (Math.random() < 0.25 && gameScore > 3) {
          const spx = Math.floor(Math.random() * (360 - 30));
          spikes.push({
            x: spx,
            y: lastPlatformY + 2,
            w: 30, h: 12
          });
        }

        // Heart
        if (Math.random() < 0.08) {
          hearts.push({
            x: px + pw / 2 - 8,
            y: lastPlatformY - 40,
            w: 16, h: 14,
            collected: false
          });
        }
      }
    }

    function collides(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function update() {
      if (gameOver) return;

      frameCount++;
      if (frameCount % 8 === 0) animFrame++;

      // Horizontal movement
      if (keys.left) {
        player.vx = -3.5;
        player.facing = -1;
      } else if (keys.right) {
        player.vx = 3.5;
        player.facing = 1;
      } else {
        player.vx *= 0.75;
        if (Math.abs(player.vx) < 0.3) player.vx = 0;
      }

      player.x += player.vx;

      // Wrap around
      if (player.x + player.w < 0) player.x = 360;
      if (player.x > 360) player.x = -player.w;

      // Gravity
      player.vy += 0.45;
      if (player.vy > 10) player.vy = 10;
      player.y += player.vy;
      player.onGround = false;

      // Platform collision
      for (const p of platforms) {
        const py = p.y - scrollOffset;
        if (
          player.vy >= 0 &&
          player.x + player.w > p.x + 2 &&
          player.x < p.x + p.w - 2 &&
          player.y + player.h >= py &&
          player.y + player.h <= py + p.h + 8
        ) {
          player.y = py - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }

      // Scroll up
      if (player.y < 180) {
        const diff = 180 - player.y;
        scrollOffset -= diff;
        player.y = 180;
      }

      // Coins
      for (const c of coins) {
        if (c.collected) continue;
        const cy = c.y - scrollOffset;
        if (collides(
          { x: player.x, y: player.y, w: player.w, h: player.h },
          { x: c.x, y: cy, w: c.w, h: c.h }
        )) {
          c.collected = true;
          gameScore++;
          scoreEl.textContent = gameScore;
        }
      }

      // Hearts
      for (const h of hearts) {
        if (h.collected) continue;
        const hy = h.y - scrollOffset;
        if (collides(
          { x: player.x, y: player.y, w: player.w, h: player.h },
          { x: h.x, y: hy, w: h.w, h: h.h }
        )) {
          h.collected = true;
          lives = Math.min(lives + 1, 5);
          livesEl.textContent = lives;
        }
      }

      // Spikes
      for (const s of spikes) {
        const sy = s.y - scrollOffset;
        if (collides(
          { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 4 },
          { x: s.x, y: sy, w: s.w, h: s.h }
        )) {
          lives--;
          livesEl.textContent = lives;
          player.vy = -7;
          player.y -= 20;
          if (lives <= 0) {
            endGame();
            return;
          }
        }
      }

      // Fall off screen
      if (player.y > 500) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          endGame();
          return;
        }
        // Respawn
        player.y = 100;
        player.vy = 0;
      }

      generatePlatforms();

      // Cleanup
      platforms.splice(0, platforms.filter(p => p.y - scrollOffset > 500).length ? 0 : 0);
      coins = coins.filter(c => !c.collected || c.y - scrollOffset < 500);
      spikes = spikes.filter(s => s.y - scrollOffset < 500);
      hearts = hearts.filter(h => !h.collected || h.y - scrollOffset < 500);
    }

    function endGame() {
      gameOver = true;
      if (gameScore > bestScore) {
        bestScore = gameScore;
        localStorage.setItem("pixelBest", bestScore);
        bestEl.textContent = bestScore;
        messageEl.textContent = "🎉 Record baru! Skor: " + gameScore;
      } else {
        messageEl.textContent = "Game Over! Skor: " + gameScore;
      }
      startBtn.style.display = "block";
    }

    function draw() {
      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, 400);
      grad.addColorStop(0, "#0c0c2e");
      grad.addColorStop(0.5, "#1a1a3e");
      grad.addColorStop(1, "#16213e");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 360, 400);

      // Stars
      for (const s of stars) {
        if ((frameCount + s.blink) % 60 < 45) {
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }
      }

      // Clouds
      for (const c of clouds) {
        drawCloud(c.x, c.y);
        c.x += c.speed;
        if (c.x > 380) c.x = -40;
      }

      // Platforms
      for (const p of platforms) {
        const py = p.y - scrollOffset;
        if (py > -20 && py < 420) {
          drawPlatform(p.x, py, p.w, p.h);
        }
      }

      // Coins
      for (const c of coins) {
        if (c.collected) continue;
        const cy = c.y - scrollOffset;
        if (cy > -20 && cy < 420) {
          drawPixelCoin(c.x, cy, frameCount);
        }
      }

      // Spikes
      for (const s of spikes) {
        const sy = s.y - scrollOffset;
        if (sy > -20 && sy < 420) {
          drawPixelSpike(s.x, sy);
        }
      }

      // Hearts
      for (const h of hearts) {
        if (h.collected) continue;
        const hy = h.y - scrollOffset;
        if (hy > -20 && hy < 420) {
          drawPixelHeart(h.x, hy);
        }
      }

      // Player
      ctx.save();
      if (player.facing === -1) {
        ctx.translate(player.x + player.w, 0);
        ctx.scale(-1, 1);
        drawPixelChar(0, player.y, player.onGround ? animFrame : 0);
      } else {
        drawPixelChar(player.x, player.y, player.onGround ? animFrame : 0);
      }
      ctx.restore();

      // Game over overlay
      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, 360, 400);

        ctx.fillStyle = "#facc15";
        ctx.font = "bold 24px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 180, 170);

        ctx.fillStyle = "#e2e8f0";
        ctx.font = "16px 'Courier New'";
        ctx.fillText("Skor: " + gameScore, 180, 210);

        ctx.textAlign = "start";
      }
    }

    function gameLoop() {
      if (gameStarted) {
        update();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ===== CONTROLS =====
    // Touch
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const jumpBtn = document.getElementById("jumpBtn");

    leftBtn.addEventListener("pointerdown", e => { e.preventDefault(); keys.left = true; });
    leftBtn.addEventListener("pointerup", e => { e.preventDefault(); keys.left = false; });
    leftBtn.addEventListener("pointerleave", e => { keys.left = false; });

    rightBtn.addEventListener("pointerdown", e => { e.preventDefault(); keys.right = true; });
    rightBtn.addEventListener("pointerup", e => { e.preventDefault(); keys.right = false; });
    rightBtn.addEventListener("pointerleave", e => { keys.right = false; });

    jumpBtn.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (!gameStarted) {
        initGame();
        return;
      }
      if (gameOver) return;
      if (player.onGround) {
        player.vy = -9;
        player.onGround = false;
      }
    });

    // Keyboard
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if (e.key === " " || e.key === "ArrowUp" || e.key === "w") {
        if (!gameStarted) {
          initGame();
          return;
        }
        if (!gameOver && player.onGround) {
          player.vy = -9;
          player.onGround = false;
        }
      }
    });

    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    });

    startBtn.addEventListener("click", () => {
      initGame();
    });

    // Start
    initGame();
    gameLoop();
  </script>
</body>
</html>
