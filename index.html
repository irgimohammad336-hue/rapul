<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Space War - Game Perang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
    }

    #gameWrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    #ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0,50,100,0.8);
      border: 1px solid #00f0ff;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
    }

    .ui-box {
      text-align: center;
    }

    .ui-label {
      font-size: 10px;
      color: #00f0ff;
      letter-spacing: 2px;
    }

    .ui-value {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    #livesDisplay {
      font-size: 18px;
    }

    canvas {
      display: block;
      width: 100%;
      border: 2px solid #00f0ff;
      border-top: none;
      border-bottom: none;
      box-shadow: 0 0 20px #00f0ff44;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(0,50,100,0.8);
      border: 1px solid #00f0ff;
      border-top: none;
      border-radius: 0 0 12px 12px;
      gap: 8px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 4px;
    }

    .btn {
      background: rgba(0, 200, 255, 0.15);
      border: 2px solid #00f0ff;
      border-radius: 10px;
      color: #00f0ff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.1s;
      width: 50px;
      height: 50px;
    }

    .btn:active, .btn.pressed {
      background: rgba(0, 200, 255, 0.5);
      box-shadow: 0 0 10px #00f0ff;
    }

    .btn-left  { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
    .btn-right { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-down  { grid-column: 2; grid-row: 2; }

    .btn-fire {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      font-size: 30px;
      background: rgba(255, 50, 50, 0.2);
      border-color: #ff4444;
      color: #ff4444;
      flex-shrink: 0;
    }

    .btn-fire:active, .btn-fire.pressed {
      background: rgba(255, 50, 50, 0.6);
      box-shadow: 0 0 20px #ff4444;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,30,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 12px;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      font-size: 30px;
      color: #00f0ff;
      text-shadow: 0 0 15px #00f0ff;
      margin-bottom: 10px;
    }

    #overlay .sub {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    #overlay .score-show {
      font-size: 36px;
      color: #ffd700;
      font-weight: bold;
      margin: 10px 0;
      text-shadow: 0 0 10px #ffd700;
    }

    #overlay .high-show {
      font-size: 14px;
      color: #00f0ff;
      margin-bottom: 20px;
    }

    #startBtn {
      background: linear-gradient(135deg, #00f0ff, #0070ff);
      color: #000;
      border: none;
      padding: 14px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #00f0ff88;
      letter-spacing: 2px;
    }

    #startBtn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    .wave-badge {
      background: #ffd700;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      display: inline-block;
    }
  </style>
</head>
<body>

      <div class="ui-value" id="scoreUI">0</div>
    </div>
    <div class="ui-box">
      <div class="ui-label">LEVEL</div>
      <div class="ui-value" id="waveUI">1</div>
    </div>
