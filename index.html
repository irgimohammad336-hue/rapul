<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batu Gunting Kertas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    p {
      text-align: center;
      color: #cbd5e1;
      margin-top: 0;
    }

    .scoreboard {
      display: flex;
      gap: 12px;
      margin: 18px 0;
    }

    .score-box {
      flex: 1;
      background: #1e293b;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .score-box span {
      display: block;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .score-box strong {
      font-size: 28px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    button.choice {
      border: none;
      border-radius: 16px;
      padding: 16px 10px;
      font-size: 18px;
      font-weight: bold;
      background: #334155;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button.choice:active {
      transform: scale(0.96);
    }

    .result-box {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
    }

    .result-box div {
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    #result {
      font-weight: bold;
      color: #facc15;
    }

    #resetBtn {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background: #22c55e;
      color: #052e16;
      cursor: pointer;
    }

    .small {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✊✌️✋ Batu Gunting Kertas</h1>
    <p>Pilih salah satu, lalu lawan komputer.</p>

    <div class="scoreboard">
      <div class="score-box">
        <span>Kamu</span>
        <strong id="playerScore">0</strong>
      </div>
      <div class="score-box">
        <span>Komputer</span>
        <strong id="computerScore">0</strong>
      </div>
    </div>

    <div class="choices">
      <button class="choice" data-choice="batu">✊ Batu</button>
      <button class="choice" data-choice="gunting">✌️ Gunting</button>
      <button class="choice" data-choice="kertas">✋ Kertas</button>
    </div>

    <div class="result-box">
      <div>Pilihan kamu: <strong id="playerChoice">-</strong></div>
      <div>Pilihan komputer: <strong id="computerChoice">-</strong></div>
      <div>Hasil: <strong id="result">Silakan pilih</strong></div>
    </div>

    <button id="resetBtn">Reset Skor</button>

    <div class="small">Mainkan langsung dari HP Android di Chrome.</div>
  </div>

  <script>
    const choices = ["batu", "gunting", "kertas"];

    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");
    const playerChoiceEl = document.getElementById("playerChoice");
    const computerChoiceEl = document.getElementById("computerChoice");
    const resultEl = document.getElementById("result");
    const resetBtn = document.getElementById("resetBtn");

    let playerScore = 0;
    let computerScore = 0;

    function getComputerChoice() {
      const randomIndex = Math.floor(Math.random() * choices.length);
      return choices[randomIndex];
    }

    function getWinner(player, computer) {
      if (player === computer) return "seri";

      if (
        (player === "batu" && computer === "gunting") ||
        (player === "gunting" && computer === "kertas") ||
        (player === "kertas" && computer === "batu")
      ) {
        return "player";
      }

      return "computer";
    }

    function tampilNama(choice) {
      if (choice === "batu") return "✊ Batu";
      if (choice === "gunting") return "✌️ Gunting";
      if (choice === "kertas") return "✋ Kertas";
      return "-";
    }

    function playGame(playerChoice) {
      const computerChoice = getComputerChoice();
      const winner = getWinner(playerChoice, computerChoice);

      playerChoiceEl.textContent = tampilNama(playerChoice);
      computerChoiceEl.textContent = tampilNama(computerChoice);

      if (winner === "seri") {
        resultEl.textContent = "Seri!";
      } else if (winner === "player") {
        playerScore++;
        playerScoreEl.textContent = playerScore;
        resultEl.textContent = "Kamu menang!";
      } else {
        computerScore++;
        computerScoreEl.textContent = computerScore;
        resultEl.textContent = "Komputer menang!";
      }
    }

    document.querySelectorAll(".choice").forEach(button => {
      button.addEventListener("click", () => {
        const playerChoice = button.getAttribute("data-choice");
        playGame(playerChoice);
      });
    });

    resetBtn.addEventListener("click", () => {
      playerScore = 0;
      computerScore = 0;
      playerScoreEl.textContent = "0";
      computerScoreEl.textContent = "0";
      playerChoiceEl.textContent = "-";
      computerChoiceEl.textContent = "-";
      resultEl.textContent = "Silakan pilih";
    });
  </script>
</body>
</html>
